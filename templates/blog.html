{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ section.title }}
</h1>
<ul>
  <!-- If you are using pagination, section.pages will be empty.
       You need to use the paginator object -->  
  {% for page in section.pages %}
  <li><a href="{{ page.permalink | safe }}"><h4>{{ page.title }}:</h4><p>{{ page.date }}</p></a></li>
  {% endfor %}
</ul>
{% endblock content %}
